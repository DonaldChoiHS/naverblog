[project]
name = "naverblog"
version = "0.1.0"
description = "네이버 블로그 AI 초안 생성 + 자동 발행 도구"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "playwright>=1.50",
    "pydantic>=2",
    "python-dotenv>=1",
    "markdown>=3.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
naverblog = "naverblog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["naverblog"]
